spring:
  datasource:
    url: jdbc:h2:mem:logisticsdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  security:
    enable-login: true
  jwt:
    secret: dachser-logistics-super-secret-key-32-chars-min
    expiration-ms: 28800000
