spring:

  datasource:
    url: jdbc:h2:mem:logisticsdb;MODE=MySQL # mode mysql so H2 supports the syntax in data.sql
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

app:

  security:
    enable-login: true

  jwt:
    secret: dachser-logistics-super-secret-key-32-chars-min
    expiration-ms: 28800000

ai:
  active-provider: mistral

  providers:
    groq:
      url: https://api.groq.com/openai/v1/chat/completions
      model: llama3-70b-8192
      api-key: ${GROQ_API_KEY}

    mistral:
      url: https://api.mistral.ai/v1/chat/completions
      model: mistral-small-latest
      api-key: ${MISTRAL_API_KEY}
